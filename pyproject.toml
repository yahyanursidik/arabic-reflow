[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reflow-engine"
version = "0.4.0"
description = "Open-source reconstruction engine converting mixed Arabic-Latin PDFs into semantic, reflowable EPUB 3 documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Reflow contributors" }]
dependencies = [
    "pymupdf>=1.26.0",
    "pydantic>=2.9.0",
    "ebooklib>=0.18",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pymupdf-fonts>=1.0.5",
]
ocr-paddle = [
    "paddleocr>=3.0.0",
    "numpy>=1.26.0",
]
ocr-tesseract = [
    "pytesseract>=0.3.13",
    "Pillow>=10.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
