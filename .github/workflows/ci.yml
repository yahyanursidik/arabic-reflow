name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install engine and dev dependencies
        run: pip install -e ".[api,dev]"
      - name: Run tests (unit + fixture + golden + snapshot)
        run: pytest -q
      - name: Check ReflowDoc JSON schema is up to date
        run: python -m engine.reflowdoc.schema --check

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
